name: dogovor-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dogovor
      POSTGRES_PASSWORD: dogovor
      POSTGRES_DB: dogovor
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogovor"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    profiles: [full]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://dogovor:dogovor@postgres:5432/dogovor?sslmode=disable
      TEMPLATES_DIR: /app/templates
      KNOWLEDGE_DIR: /app/knowledge
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["127.0.0.1:8080:8080"]

  web:
    profiles: [full]
    build: { context: ../apps/web }
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
